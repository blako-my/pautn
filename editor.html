<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pautn Editor</title>
    <link id="favicon" rel="icon" href="uploads/default-icon.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body class="container">
    <div class="row h-100">
        <div class="col-12 col-md-6 mb-3">
            <form id="editorform" action="" class="">
                <div class="row"><div class="col-12 text-center">Style</div></div>
                <label for="theme">Theme</label>
                <select class="form-control" name="theme" id="theme">
                    <option value="default">Default</option>
                    <option value="midnight">Midnight</option>
                    <option value="nordic">Nordic</option>
                    <option value="cyber">Cyber</option>
                    <option value="forest">Forest</option>
                    <option value="terminal">terminal</option>
                </select>
                <div class="row"><div class="col-12 text-center">Profile</div></div>
                <label for="username">Username</label>
                <input class="form-control" type="text" name="username" id="username" required>
                <label for="name">Name</label>
                <input class="form-control" type="text" name="name" id="name">
                <label for="bio">Bio</label>
                <input class="form-control" type="text" name="bio" id="bio">
                <br>
            </form>
        </div>
        <div class="col-12 col-md-6 mb-3">
            <div class="row w-100 my-1">
                <div class="col-4 text-center"><span id="status" class="badge rounded-pill d-inline-flex align-items-center text-xs text-wrap-none bg-success">Active  </span></div>
                <div class="col-4"><button id="downloadButton" class="form-control btn btn-primary"><i class="bi bi-download"></i></button></div>
                <div class="col-4"><button id="copyBtn" class="form-control btn btn-primary"><i class="bi bi-copy"></i></button></div>
            </div>
            <textarea name="preview" id="preview" class="h-75 w-100" style="resize:none"></textarea>
        </div>
    </div>
</body>
</html>
<script>
statusbar = document.getElementById('status');
editorform = document.getElementById('editorform');
preview = document.getElementById('preview');
profilekey = ['username','name','bio'];

editorform.addEventListener('keyup',refeshpreview);
editorform.addEventListener('change',refeshpreview);

function refeshpreview(event){
    statusbar.textContent = "Updating";
    if(event.target.matches('input,textarea,select')){
        preview.innerHTML = '{\n';
        //THEME
        themeelement = document.getElementById('theme');
        if(themeelement.value.trim() !== ""){
            preview.innerHTML += `\t"theme":"${themeelement.value}"`
        }
        //PROFILE
        preview.innerHTML += ',\n\t"profile":{\n';
        const lines = profilekey
            .map(key => document.getElementById(key))
            .filter(el => el && el.value.trim() !== "")
            .map(el => `\t\t"${el.id}": "${el.value}"`);
        preview.innerHTML += lines.join(",\n");
        preview.innerHTML += '\n\t}';
        //closing
        preview.innerHTML += '\n}';
    }
    statusbar.textContent = "Updated";
}
document.getElementById('downloadButton').addEventListener('click',function(){
    const text = document.getElementById('preview').value;
    const blob = new Blob([text], {type: "application/json;charset=utf-8"});
    //Download
    const downloadLink = document.createElement("a");
    downloadLink.href = URL.createObjectURL(blob);
    downloadLink.download = document.getElementById('username').value + ".user";
    document.body.appendChild(downloadLink);
    downloadLink.click();
    document.body.removeChild(downloadLink);
});
document.getElementById('copyBtn').addEventListener('click', async (e) => {
    e.preventDefault(); 
    const textToCopy = document.getElementById('preview').value;
    try {
        await navigator.clipboard.writeText(textToCopy);
        alert('Copied!');
    } catch (err) {
        alert('Failed to copy.');
    }
});
</script>
